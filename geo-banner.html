<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoBanner 2.0 — AMD Banner Unification</title>
<!--
  Implemented from Figma: H1'26 — AMD banner unification (node 2260:54179)
  Design tokens:
    Background/Background Info : #CBD2D9
    Text/Text Value           : #1C2B33   (title 15/20 bold, desc 12/16 regular)
    Icon/Icon Default         : #283943
    Border/Border Button Prim : #A7B3BF
  WCAG color check:
    #1C2B33 on #CBD2D9 = 9.41:1  ✅ AAA (text)
    #283943 on #CBD2D9 = 7.83:1  ✅ (non-text 3:1)
    #A7B3BF on #CBD2D9 = 1.42:1  ⚠ fails 3:1 (outline border) — see .geo-btn--a11y for a passing variant
-->
<style>
  :root{
    --bg-info:#CBD2D9;
    --text-value:#1C2B33;
    --icon-default:#283943;
    --border-btn:#A7B3BF;
    --border-btn-a11y:#647079;     /* ~3.3:1 on --bg-info, passes 1.4.11 */
    --sp-4:8px; --sp-5:12px; --sp-6:16px;
    --radius-3:4px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:#eef1f4;color:var(--text-value);
    padding:48px 24px;-webkit-font-smoothing:antialiased;}
  .demo{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
  .demo h1{font-size:18px;margin:0 0 4px;}
  .demo .label{font-size:12px;color:#5c6770;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}

  /* ---------- GeoBanner.2.0 ---------- */
  .geo-banner{display:flex;align-items:center;gap:var(--sp-4);
    background:var(--bg-info);padding:var(--sp-4) var(--sp-5);width:100%;}
  .geo-banner__main{display:flex;flex:1 1 0;gap:var(--sp-4);align-items:center;min-width:0;}
  .geo-banner__icon{flex-shrink:0;width:24px;height:24px;color:var(--icon-default);}
  .geo-banner__icon svg{display:block;width:24px;height:24px;}
  .geo-banner__text{display:flex;flex-direction:column;min-width:0;}
  .geo-banner__title{margin:0;font-size:15px;line-height:20px;font-weight:700;color:var(--text-value);
    word-break:break-word;}
  .geo-banner__desc{margin:0;font-size:12px;line-height:16px;font-weight:400;color:var(--text-value);
    word-break:break-word;}
  .geo-banner__actions{display:flex;gap:8px;align-items:stretch;flex-shrink:0;}

  /* outline button */
  .geo-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-4);
    height:36px;padding:var(--sp-4) var(--sp-6);border-radius:var(--radius-3);
    border:1px solid var(--border-btn);background:transparent;color:var(--text-value);
    font-family:var(--font);font-size:14px;line-height:20px;font-weight:700;
    cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;}
  .geo-btn:hover{background:rgba(40,57,67,.06);}
  .geo-btn:focus-visible{outline:2px solid var(--text-value);outline-offset:2px;}
  .geo-btn--a11y{border-color:var(--border-btn-a11y);}   /* AA non-text contrast */

  /* icon (close) button */
  .geo-iconbtn{display:inline-flex;align-items:center;justify-content:center;
    padding:var(--sp-4) var(--sp-5);border-radius:var(--radius-3);border:none;background:transparent;
    color:var(--icon-default);cursor:pointer;transition:background .15s;}
  .geo-iconbtn:hover{background:rgba(40,57,67,.08);}
  .geo-iconbtn:focus-visible{outline:2px solid var(--text-value);outline-offset:2px;}
  .geo-iconbtn svg{display:block;width:16px;height:16px;}
</style>
</head>
<body>
  <div class="demo">
    <div>
      <h1>GeoBanner 2.0</h1>
      <p class="label" style="text-transform:none;font-weight:400;color:#5c6770;">From Figma — AMD banner unification (node 2260:54179)</p>
    </div>

    <!-- as designed -->
    <div>
      <p class="label">As designed</p>
      <div class="geo-banner" role="status" aria-label="Preview. Description">
        <div class="geo-banner__main">
          <span class="geo-banner__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 11.5v4.5"/>
              <circle cx="12" cy="8" r="0.7" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <div class="geo-banner__text">
            <p class="geo-banner__title">Preview</p>
            <p class="geo-banner__desc">Description</p>
          </div>
        </div>
        <div class="geo-banner__actions">
          <button type="button" class="geo-btn">Button</button>
          <button type="button" class="geo-iconbtn" aria-label="Dismiss">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- accessible border variant -->
    <div>
      <p class="label">Accessible border variant (button border #647079 · 3.3:1)</p>
      <div class="geo-banner" role="status" aria-label="Preview. Description">
        <div class="geo-banner__main">
          <span class="geo-banner__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 11.5v4.5"/>
              <circle cx="12" cy="8" r="0.7" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <div class="geo-banner__text">
            <p class="geo-banner__title">Preview</p>
            <p class="geo-banner__desc">Description</p>
          </div>
        </div>
        <div class="geo-banner__actions">
          <button type="button" class="geo-btn geo-btn--a11y">Button</button>
          <button type="button" class="geo-iconbtn" aria-label="Dismiss">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
